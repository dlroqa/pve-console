name: CI

# Validate source once, then reuse the exact production bundle for Electron E2E.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit & integration tests
        run: npm test

      # The build script includes TypeScript checks for renderer and main.
      - name: Typecheck & build production bundle
        run: npm run build

      - name: Upload production bundle
        uses: actions/upload-artifact@v7
        with:
          name: desktop-dist
          path: apps/desktop/dist
          if-no-files-found: error
          retention-days: 7

  e2e:
    name: End-to-end (Electron)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download verified production bundle
        uses: actions/download-artifact@v8
        with:
          name: desktop-dist
          path: apps/desktop/dist

      # Electron supplies Chromium; only its Linux runtime libraries are needed.
      - name: Install Electron runtime dependencies
        run: npx playwright install-deps chromium

      - name: Run Playwright Electron E2E
        run: env -u ELECTRON_RUN_AS_NODE xvfb-run --auto-servernum npm run test:e2e --workspace apps/desktop

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/desktop/playwright-report
          if-no-files-found: ignore
          retention-days: 7
