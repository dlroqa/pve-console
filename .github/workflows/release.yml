name: Package & Release

# Cross-platform packaging via electron-builder. Source validation and rendering
# happen once; every platform packages the same verified dist artifact.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  preflight:
    name: Test · Render · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit & integration tests
        run: npm test

      - name: Typecheck & build production bundle
        run: npm run build

      - name: Install Electron runtime dependencies
        run: npx playwright install-deps chromium

      - name: Electron E2E
        run: env -u ELECTRON_RUN_AS_NODE xvfb-run --auto-servernum npm run test:e2e --workspace apps/desktop

      - name: Upload verified production bundle
        uses: actions/upload-artifact@v7
        with:
          name: release-dist
          path: apps/desktop/dist
          if-no-files-found: error
          retention-days: 7

  package:
    name: Package (${{ matrix.os }})
    needs: preflight
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download verified production bundle
        uses: actions/download-artifact@v8
        with:
          name: release-dist
          path: apps/desktop/dist

      - name: Package prebuilt bundle with electron-builder
        run: npm run package:dist
        env:
          # Do not attempt macOS code signing without credentials.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pve-console-${{ matrix.os }}
          # Top-level installers only — never unpacked app directories.
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all packaged artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Collect installers
        id: collect
        run: |
          mkdir -p dist-release
          find artifacts -type f \
            \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' \
               -o -name '*.AppImage' -o -name '*.deb' \) \
            -exec cp {} dist-release/ \;
          echo "Collected installers:"
          ls -la dist-release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist-release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "PVE Console $GITHUB_REF_NAME" \
            --generate-notes
