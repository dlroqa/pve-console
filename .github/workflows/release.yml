name: Package & Release

# Cross-platform packaging (Windows / macOS / Linux) via electron-builder on
# GitHub-hosted runners. Pushing a v* tag builds installers on all three OSes
# and publishes them as a GitHub Release. A manual run (workflow_dispatch)
# performs the same packaging as an integrity check but does not publish.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package with electron-builder
        # `npm run package` runs typecheck + build + electron-builder --publish never.
        run: npm run package
        env:
          # Do not attempt macOS code signing without credentials.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pve-console-${{ matrix.os }}
          # Top-level installers only — never the unpacked app dirs
          # (win-unpacked/*.exe, elevate.exe, *.app contents, etc.).
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect installers
        id: collect
        run: |
          mkdir -p dist-release
          find artifacts -type f \
            \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' \
               -o -name '*.AppImage' -o -name '*.deb' \) \
            -exec cp {} dist-release/ \;
          echo "Collected installers:"
          ls -la dist-release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist-release/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "PVE Console ${GITHUB_REF_NAME}" \
            --generate-notes
