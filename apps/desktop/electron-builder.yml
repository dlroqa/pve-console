appId: com.pveconsole.desktop
productName: PVE Console
copyright: Copyright © 2026 PVE Console

directories:
  output: release
  buildResources: assets

files:
  - dist/**/*
  - package.json
  - assets/icon.png

# Do not sign in CI without credentials; signing/notarization is configured per environment.
asar: true

# This app has no native (compiled) dependencies, so skip the native rebuild /
# production-dependency install step. This also avoids a fragile app-builder
# invocation in the npm-workspace layout on CI runners.
npmRebuild: false
nodeGypRebuild: false

win:
  target:
    - nsis
  icon: icon.ico
  artifactName: ${productName}-${version}-Setup.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

mac:
  target:
    - dmg
    - zip
  icon: icon.png
  category: public.app-category.developer-tools
  # Ship unsigned: no signing identity and no notarization. Users open the app
  # via right-click > Open (Gatekeeper) the first time.
  identity: null
  notarize: false

linux:
  target:
    - AppImage
    - deb
  icon: icon.png
  category: Utility
  maintainer: PVE Console <pve-console@users.noreply.github.com>
