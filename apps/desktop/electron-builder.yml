appId: com.pveconsole.desktop
productName: PVE Console
copyright: Copyright © 2026 PVE Console

directories:
  output: release
  buildResources: assets

files:
  - dist/**/*
  - package.json
  - assets/icon.png

# Do not sign in CI without credentials; signing/notarization is configured per environment.
asar: true

# ssh2 has an optional CPU-features accelerator but uses its supported
# JavaScript fallback when that addon is unavailable. No required production
# dependency needs an Electron ABI rebuild, so keep packaging reproducible in
# the npm-workspace layout by skipping native rebuilds.
npmRebuild: false
nodeGypRebuild: false

# Ad-hoc sign the macOS app (see build/after-pack.cjs) so it runs on Apple
# Silicon while remaining unsigned in the Developer-ID sense.
afterPack: build/after-pack.cjs

win:
  target:
    - nsis
  icon: icon.ico
  artifactName: ${productName}-${version}-Setup.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

mac:
  target:
    - dmg
    - zip
  icon: icon.png
  category: public.app-category.developer-tools
  # Ship unsigned: no signing identity and no notarization. Users open the app
  # via right-click > Open (Gatekeeper) the first time.
  identity: null
  notarize: false

linux:
  syncDesktopName: true
  target:
    - AppImage
    - deb
  icon: icon.png
  category: Utility
  maintainer: PVE Console <pve-console@users.noreply.github.com>
